# Publication of a version, started by the push of a tag vMAJ.MIN.CORR (and by
# nothing else: scripts/verifier-workflows.sh enforces it).
#
# Two jobs. "build" has no right beyond reading the code and produces the
# archives and SHA256SUMS. "publish" is the only job that can write: it signs
# SHA256SUMS with cosign, keyless (the OIDC token of this run, certificate from
# Sigstore), checks the signature it has just made, then creates the GitHub
# release. The signing job builds nothing: it only handles the files of "build".
#
# Both jobs run on the runner group of the factory (giis-usine-lourd, as the
# pull request checks): GitHub-hosted runners are not used, and the repository
# is private. The keyless signature works there too, the OIDC token comes from
# GitHub. "publish" waits for the approval of the protected environment
# "release" (Settings > Environments, required reviewer, tags v* only).
# No secret is used; the Homebrew formula is produced as a release file and
# copied to the tap by hand (CONTRIBUTING.md, "Publier une version").
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: archives et sommes de contrôle
    runs-on:
      group: giis-usine-lourd
      labels: [giis-usine-lourd]
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10" # same as the toolchain line of go.mod
          cache: false
      - name: the tag is the version of the repository
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [ "${TAG#v}" = "$(tr -d '[:space:]' < VERSION)" ] || { echo "tag $TAG differs from the VERSION file" >&2; exit 1; }
      - name: build, archive, checksum
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=${TAG#v}
          stamp=$(git log -1 --format=%ct)
          mkdir dist
          for target in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64; do
            os=${target%/*}
            arch=${target#*/}
            name=sagnac_${version}_${os}_${arch}
            mkdir "dist/$name"
            GOOS=$os GOARCH=$arch make build VERSION="$TAG" BIN="dist/$name/sagnac"
            cp LICENSE NOTICE "dist/$name/"
            # Same bytes for the same sources: sorted names, fixed dates and owner, gzip without a date.
            tar --sort=name --mtime="@$stamp" --owner=0 --group=0 --numeric-owner \
              -C "dist/$name" -cf - sagnac LICENSE NOTICE | gzip -n -9 > "dist/$name.tar.gz"
            rm -r "dist/$name"
          done
          (cd dist && sha256sum -- *.tar.gz > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: signature et publication
    needs: build
    environment: release
    runs-on:
      group: giis-usine-lourd
      labels: [giis-usine-lourd]
    timeout-minutes: 10
    permissions:
      contents: write # create the release
      id-token: write # OIDC token of the keyless signature
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: check the files of the build
        run: |
          set -euo pipefail
          cd dist
          set -- *
          [ "$#" -eq 5 ] || { echo "expected 4 archives and SHA256SUMS, found: $*" >&2; exit 1; }
          sha256sum --check --strict SHA256SUMS
      - name: sign SHA256SUMS (keyless)
        working-directory: dist
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
      - name: verify the signature just made
        working-directory: dist
        env:
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          cosign verify-blob \
            --bundle SHA256SUMS.sigstore.json \
            --certificate-identity "https://github.com/${WORKFLOW_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            SHA256SUMS
      - name: Homebrew formula
        env:
          TAG: ${{ github.ref_name }}
        run: scripts/formule-homebrew.sh "${TAG#v}" dist/SHA256SUMS > dist/sagnac.rb
      - name: create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" --verify-tag --title "sagnac $TAG" --generate-notes dist/*
