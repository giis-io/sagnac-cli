# Checks of a pull request. Runs on disposable VMs, one job each. Until the
# first public release, the repository is private and uses the runner group
# giis-usine-lourd; the dedicated group sagnac-cli-pr, limited to this
# repository, replaces it before the repository becomes public. No token
# beyond reading the code, no OIDC token, no secret; the workflows of outside
# contributors wait for the approval of a maintainer. scripts/verifier-workflows.sh enforces
# these rules on every workflow of the repository.
name: pr

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: sh

jobs:
  workflows:
    name: workflows et scripts
    runs-on:
      group: giis-usine-lourd
      labels: [giis-usine-lourd]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: scripts/verifier-workflows.sh
      - run: scripts/tests.sh

  dco:
    name: certificat d'origine (DCO)
    runs-on:
      group: giis-usine-lourd
      labels: [giis-usine-lourd]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: scripts/verifier-dco.sh "$BASE" "$HEAD"

  go:
    name: vet, tests, vulnérabilités
    runs-on:
      group: giis-usine-lourd
      labels: [giis-usine-lourd]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10" # same as the toolchain line of go.mod
          cache: false
      - name: go vet (linux)
        run: GOOS=linux go vet ./...
      - name: go vet (darwin)
        run: GOOS=darwin go vet ./...
      - name: go test -race
        run: CGO_ENABLED=1 go test -race -count=1 ./...
      - name: govulncheck v1.8.0
        run: make vuln
